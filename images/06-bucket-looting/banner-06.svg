<svg viewBox="0 0 1300 380" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a2f"/>
      <stop offset="1" stop-color="#0d2742"/>
    </linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#ff6b6b"/>
    </marker>
  </defs>
  <rect width="1300" height="380" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="380" fill="#2f6fb0"/>

  <text x="60" y="78" fill="#6f93b8" font-size="16" letter-spacing="4" font-weight="600">MAD HAT LABS  ·  AZURE  ·  CHAPTER 6</text>
  <text x="58" y="168" fill="#eef4fb" font-size="76" font-weight="700">Bucket Looting</text>
  <text x="60" y="214" fill="#c3d4e6" font-size="23">Following a Key Vault secret to its data, and the copy nobody locked.</text>

  <line x1="60" y1="256" x2="760" y2="256" stroke="#1e3a57" stroke-width="1.5"/>
  <text x="60" y="300" fill="#9db4cc" font-size="19">Hardening doesn&#39;t travel with the data.</text>
  <text x="60" y="330" fill="#6f93b8" font-size="16">Data-and-secrets trace · read-only · identifiers and answers redacted</text>

  <!-- right-side motif: hardened box vs open box with bypass arrow -->
  <g>
    <rect x="905" y="120" width="150" height="140" rx="10" fill="#10243d" stroke="#2fbf71" stroke-width="1.5"/>
    <text x="980" y="150" text-anchor="middle" fill="#39d98a" font-size="13" font-weight="700">PRIMARY</text>
    <text x="980" y="178" text-anchor="middle" fill="#cfe0ef" font-size="12">key off</text>
    <text x="980" y="200" text-anchor="middle" fill="#cfe0ef" font-size="12">public off</text>
    <text x="980" y="222" text-anchor="middle" fill="#cfe0ef" font-size="12">vault + identity</text>
    <text x="980" y="246" text-anchor="middle" fill="#39d98a" font-size="13">&#10003; locked</text>

    <rect x="1110" y="120" width="150" height="140" rx="10" fill="#2a1420" stroke="#e24a4a" stroke-width="1.5"/>
    <text x="1185" y="150" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="700">BACKUP</text>
    <text x="1185" y="182" text-anchor="middle" fill="#cfe0ef" font-size="12">anonymous</text>
    <text x="1185" y="202" text-anchor="middle" fill="#cfe0ef" font-size="12">access ON</text>
    <text x="1185" y="246" text-anchor="middle" fill="#ff6b6b" font-size="13">&#10007; open</text>

    <path d="M 905 96 C 980 70, 1185 70, 1185 112" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <circle cx="892" cy="104" r="11" fill="#ff6b6b"/>
    <path d="M 872 150 C 872 124, 912 124, 912 150 Z" fill="#ff6b6b"/>
  </g>
</svg>
